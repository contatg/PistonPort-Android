name: PistonPort Android native CPU

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-bionic.yml
      - pistonport/native-android/spartanport-bionic.patch

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SPARTAN_REF: 56e804d1ef3e108257b94c51b6f7fb204930a244
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the SpartanPort CPU backend and its FEX version
        run: |
          src="$RUNNER_TEMP/spartanport"
          git init "$src"
          git -C "$src" remote add origin https://github.com/zFitness/gow3_android.git
          git -C "$src" fetch --depth 1 origin "$SPARTAN_REF"
          git -C "$src" checkout --detach FETCH_HEAD
          git -C "$src" submodule update --init --recursive --depth 1 --jobs 4 -- third_party/FEX
          git -C "$src" apply "$GITHUB_WORKSPACE/pistonport/native-android/spartanport-bionic.patch"

      - name: Compile the ARMv8-A CPU backend with Bionic
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          src="$RUNNER_TEMP/spartanport"
          build="$RUNNER_TEMP/bionic-cpu"
          cmake -S "$src/third_party/FEX" -B "$build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_PROJECT_FEX_INCLUDE="$src/cpu/fex_project.cmake" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_STEAM_SUPPORT=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_ZYDIS=OFF -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DTUNE_ARCH=armv8-a -DTUNE_CPU=generic
          cmake --build "$build" --target gportcpu --parallel 4

      - name: Verify the native library
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          lib="$RUNNER_TEMP/bionic-cpu/libgportcpu.so"
          "$readelf" -h "$lib" | grep -E 'Machine: +AArch64'
          "$readelf" -d "$lib" | grep -F '[libc.so]'
          ! "$readelf" -d "$lib" | grep -E 'libc\.so\.6|libstdc\+\+\.so\.6|ld-linux'
          "$readelf" --dyn-syms --wide "$lib" | grep -E 'gport_guest_cpu_call$'
