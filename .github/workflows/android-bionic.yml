name: PistonPort Android native runtime

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-bionic.yml
      - pistonport/native-android/**

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SPARTAN_REF: 56e804d1ef3e108257b94c51b6f7fb204930a244
      NDK_VERSION: 29.0.14206865
      ANDROID_API: 33
      BIONIC_DEPS_REF: 046791de0fd4639b0b479afe8fc7ec67e538925d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the SpartanPort CPU backend and its FEX version
        run: |
          src="$RUNNER_TEMP/spartanport"
          git init "$src"
          git -C "$src" remote add origin https://github.com/zFitness/gow3_android.git
          git -C "$src" fetch --depth 1 origin "$SPARTAN_REF"
          git -C "$src" checkout --detach FETCH_HEAD
          git -C "$src" submodule update --init --recursive --depth 1 --jobs 4
          git -C "$src" apply "$GITHUB_WORKSPACE/pistonport/native-android/spartanport-bionic.patch"

      - name: Compile the ARMv8-A CPU backend with Bionic
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          src="$RUNNER_TEMP/spartanport"
          build="$RUNNER_TEMP/bionic-cpu"
          cmake -S "$src/third_party/FEX" -B "$build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$ANDROID_API -DANDROID_STL=c++_shared \
            -DCMAKE_PROJECT_FEX_INCLUDE="$src/cpu/fex_project.cmake" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_STEAM_SUPPORT=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_ZYDIS=OFF -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DTUNE_ARCH=armv8-a -DTUNE_CPU=generic
          cmake --build "$build" --target gportcpu --parallel 4

      - name: Verify the native library
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          lib="$RUNNER_TEMP/bionic-cpu/libgportcpu.so"
          "$readelf" -h "$lib" | grep -E 'Machine: +AArch64'
          "$readelf" -d "$lib" | grep -F '[libc.so]'
          ! "$readelf" -d "$lib" | grep -E 'libc\.so\.6|libstdc\+\+\.so\.6|ld-linux'
          "$readelf" --dyn-syms --wide "$lib" | grep -E 'gport_guest_cpu_call$'

      - name: Build Android graphics and media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools libboost-dev robin-map-dev
          deps="$RUNNER_TEMP/bionic-deps"
          git init "$deps"
          git -C "$deps" remote add origin https://github.com/niilo/gow3_android.git
          git -C "$deps" fetch --depth 1 origin "$BIONIC_DEPS_REF"
          git -C "$deps" checkout --detach FETCH_HEAD
          vma="$RUNNER_TEMP/vma"
          git clone --quiet --depth 1 --branch v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git "$vma"
          script="$deps/tools/android/build_bionic_deps.sh"
          sed -i 's/taskset -c 2-23 nice -n 19 "\$@"/"\$@"/' "$script"
          GOW3_NDK="$ANDROID_HOME/ndk/$NDK_VERSION" GOW3_ANDROID_API="$ANDROID_API" GOW3_JOBS=4 bash "$script"
          cp "$vma/include/vk_mem_alloc.h" "$deps/.local-deps/android/bionic-prefix/include/"

      - name: Link the native game and Vulkan renderer
        run: |
          src="$RUNNER_TEMP/spartanport"
          prefix="$RUNNER_TEMP/bionic-deps/.local-deps/android/bionic-prefix"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          git -C "$src" apply "$GITHUB_WORKSPACE/pistonport/native-android/spartanport-renderer.patch"
          for patch in "$src"/gpu/patches/fsr-vulkan/*.patch; do
            git -C "$src/gpu/third_party/fsr-vulkan" apply "$patch"
          done
          native_headers="$RUNNER_TEMP/bionic-headers"
          mkdir -p "$native_headers"
          cp -R /usr/include/boost /usr/include/tsl "$native_headers/"
          mkdir -p "$prefix/lib/cmake/Boost" "$prefix/lib/cmake/tsl-robin-map"
          cat > "$prefix/lib/cmake/Boost/BoostConfig.cmake" <<EOF
          add_library(Boost::headers INTERFACE IMPORTED)
          set_target_properties(Boost::headers PROPERTIES INTERFACE_INCLUDE_DIRECTORIES "$native_headers")
          EOF
          cat > "$prefix/lib/cmake/tsl-robin-map/tsl-robin-mapConfig.cmake" <<EOF
          add_library(tsl::robin_map INTERFACE IMPORTED)
          set_target_properties(tsl::robin_map PROPERTIES INTERFACE_INCLUDE_DIRECTORIES "$native_headers")
          EOF
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          export PKG_CONFIG_SYSROOT_DIR=
          cmake -S "$src/gpu" -B "$RUNNER_TEMP/bionic-game" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="android-$ANDROID_API" -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DSPARTAN_PGO=off -DSPARTAN_LTO=OFF -DSPARTAN_ARM=ON \
            -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_FIND_ROOT_PATH="$prefix" \
            -DBoost_DIR="$prefix/lib/cmake/Boost" -Dtsl-robin-map_DIR="$prefix/lib/cmake/tsl-robin-map" \
            -DVMA_INCLUDE_DIR="$prefix/include" \
            -DSPARTAN_ANDROID_CPU="$RUNNER_TEMP/bionic-cpu/libgportcpu.so"
          cmake --build "$RUNNER_TEMP/bionic-game" --target pistonport --parallel 4

      - name: Verify and stage the native Android libraries
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          prefix="$RUNNER_TEMP/bionic-deps/.local-deps/android/bionic-prefix"
          staging="$RUNNER_TEMP/native-runtime"
          mkdir -p "$staging"
          "$llvm/bin/llvm-strip" -o "$staging/libpistonport.so" "$RUNNER_TEMP/bionic-game/libpistonport.so"
          "$llvm/bin/llvm-strip" -o "$staging/libgportcpu.so" "$RUNNER_TEMP/bionic-cpu/libgportcpu.so"
          cp "$prefix/lib/libSDL3.so" "$staging/"
          cp "$llvm/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$staging/"
          "$llvm/bin/llvm-readelf" --dyn-syms --wide "$staging/libpistonport.so" > "$RUNNER_TEMP/piston-symbols"
          grep -E 'GLOBAL.*DEFAULT +[0-9]+ SDL_main$' "$RUNNER_TEMP/piston-symbols"
          grep -E 'vkCreateInstance$' "$RUNNER_TEMP/piston-symbols"
          for library in "$staging"/*.so; do
            "$llvm/bin/llvm-readelf" -h "$library" | grep -E 'Machine: +AArch64'
            "$llvm/bin/llvm-readelf" -d "$library" > "$RUNNER_TEMP/elf-deps"
            if grep -E 'libc\.so\.6|ld-linux|libstdc\+\+\.so\.6|libX11|libwayland' "$RUNNER_TEMP/elf-deps"; then
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: PistonPort-Android-native-runtime
          path: ${{ runner.temp }}/native-runtime
          if-no-files-found: error
